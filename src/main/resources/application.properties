spring.application.name=solutis-helpdesk-gateway
server.port=9000

eureka.client.serviceUrl.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Disable default auto-locator to prevent route collisions
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.discovery.locator.lower-case-service-id=true

# Define explicit route to USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/user-service/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=StripPrefix=1

# Define explicit route to TICKET-SERVICE
spring.cloud.gateway.server.webflux.routes[1].id=ticket-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ticket-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/ticket-service/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=StripPrefix=1

# Define explicit route to NOTIFICATION-SERVICE
spring.cloud.gateway.server.webflux.routes[2].id=notification-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/notification-service/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=StripPrefix=1

# logging.level.org.springframework.cloud.gateway=TRACE
# logging.level.org.springframework.http.server.reactive=DEBUG

# Expose the gateway actuator endpoint over HTTP
management.endpoints.web.exposure.include=gateway,health,info

# Enable read-only access (allows listing routes safely)
management.endpoint.gateway.access=read-only